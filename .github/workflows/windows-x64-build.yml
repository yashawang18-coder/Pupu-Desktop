name: Windows x64 build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test-package:
    name: Build, test, and package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Python asset-audit runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install asset-audit dependencies
        shell: pwsh
        run: python -m pip install numpy pillow scipy

      - name: Display .NET environment
        shell: pwsh
        run: dotnet --info

      - name: Decode and audit every animation frame
        shell: pwsh
        run: python ./scripts/audit-asset-quality.py

      - name: Restore, build, test, gate, publish, and package
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime win-x64

      - name: Upload Windows installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: Pupu-Windows-x64-1.11.1
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/Pupu-Setup-x64-1.11.1.exe
            artifacts/Pupu-Windows-x64-1.11.1.zip
