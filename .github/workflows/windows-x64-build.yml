name: Windows x64 build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  code-tests:
    name: Fast build and tests
    uses: ./.github/workflows/windows-quick-preflight.yml

  asset-audit:
    name: Asset manifest and frame audit
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Python asset-audit runtime
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install asset-audit dependencies
        shell: pwsh
        run: python -m pip install numpy pillow scipy

      - name: Verify manifest is the only runtime asset list
        shell: pwsh
        run: ./scripts/verify-asset-manifest.ps1

      - name: Decode and validate runtime assets
        shell: pwsh
        run: ./scripts/verify-assets.ps1

      - name: Audit every animation frame
        shell: pwsh
        run: python ./scripts/audit-asset-quality.py

  package:
    name: Publish and package independently
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Read release version
        id: version
        shell: pwsh
        run: |
          $version = ./scripts/get-pupu-version.ps1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish portable app and installer
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime win-x64 -Mode Package

      - name: Upload Windows installer and portable package
        uses: actions/upload-artifact@v4
        with:
          name: Pupu-Windows-x64-${{ steps.version.outputs.version }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/Pupu-Setup-x64-${{ steps.version.outputs.version }}.exe
            artifacts/Pupu-Windows-x64-${{ steps.version.outputs.version }}.zip

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - code-tests
      - asset-audit
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Report every parallel result
        shell: bash
        run: |
          echo "code-tests=${{ needs.code-tests.result }}"
          echo "asset-audit=${{ needs.asset-audit.result }}"
          echo "package=${{ needs.package.result }}"
          test "${{ needs.code-tests.result }}" = "success"
          test "${{ needs.asset-audit.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
