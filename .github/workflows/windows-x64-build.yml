name: Windows x64 build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-verified-commit:
    name: Verify and import full-resolution assets
    if: github.event.pull_request.head.ref == 'agent/restore-control-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_STAGING: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify bundle and atomically update PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_STAGING}"
          test "$(find .github/pupu-import -type f -name 'part-*' | wc -l)" = "77"
          cat .github/pupu-import/part-* > "${RUNNER_TEMP}/pupu-39e0350.bundle"
          echo "3b2792490033abcb5a0839798205ea5088bcffefc87a9b45edb29b5ee7ed32bb  ${RUNNER_TEMP}/pupu-39e0350.bundle" | sha256sum -c -
          git bundle verify "${RUNNER_TEMP}/pupu-39e0350.bundle"
          git fetch "${RUNNER_TEMP}/pupu-39e0350.bundle" HEAD:refs/remotes/pupu/import
          imported="$(git rev-parse refs/remotes/pupu/import)"
          test "${imported}" = "39e035047ed5ef88950edb3c0fc705a3a9c7035d"
          git push origin "${imported}:refs/heads/agent/restore-control-panel"             --force-with-lease="refs/heads/agent/restore-control-panel:${EXPECTED_STAGING}"
