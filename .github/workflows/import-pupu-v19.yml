name: One-time verified Pupu V19 import

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-verified-v19:
    name: Verify and import V19 content
    if: github.event.pull_request.head.ref == 'agent/restore-control-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_STAGING: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Import content without changing workflow paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_STAGING}"
          if [ ! -f .github/pupu-import/trigger-v19 ]; then
            echo "V19 bundle was already imported; cleanup is pending."
            exit 0
          fi
          test "$(find .github/pupu-import -type f -name 'part-*' | wc -l)" = "74"
          bundle="${RUNNER_TEMP}/pupu-a8b08b4.bundle"
          cat .github/pupu-import/part-* > "${bundle}"
          echo "049680d0c07b7aa5fc5ea1bbaea288a9cec68a57ce3d44f1d16feb18f5501a41  ${bundle}" | sha256sum -c -
          git bundle verify "${bundle}"
          git fetch "${bundle}" HEAD:refs/remotes/pupu/import
          imported="$(git rev-parse refs/remotes/pupu/import)"
          test "${imported}" = "a8b08b4b473bce413d544092740c0fd1a76f9acf"

          bridge_index="${RUNNER_TEMP}/pupu-v19-bridge.index"
          GIT_INDEX_FILE="${bridge_index}" git read-tree "${imported}^{tree}"
          while IFS= read -r -d '' entry; do
            metadata="${entry%%$'\t'*}"
            path="${entry#*$'\t'}"
            read -r mode type object <<< "${metadata}"
            test "${type}" = "blob"
            GIT_INDEX_FILE="${bridge_index}" git update-index --add --cacheinfo "${mode}" "${object}" "${path}"
          done < <(git ls-tree -r -z "${EXPECTED_STAGING}" -- .github/workflows .github/pupu-import)
          GIT_INDEX_FILE="${bridge_index}" git update-index --force-remove .github/pupu-import/trigger-v19
          bridge_tree="$(GIT_INDEX_FILE="${bridge_index}" git write-tree)"
          if git diff --name-only "${EXPECTED_STAGING}^{tree}" "${bridge_tree}" |
             grep -E '^\.github/workflows/'; then
            echo "Bridge unexpectedly changes protected workflow paths." >&2
            exit 1
          fi

          export GIT_AUTHOR_NAME="Pupu V19 Import"
          export GIT_AUTHOR_EMAIL="actions@users.noreply.github.com"
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          bridge="$(printf '%s\n' 'Import verified Pupu V19 content' |
            git commit-tree "${bridge_tree}" -p "${EXPECTED_STAGING}")"
          git push origin "${bridge}:refs/heads/agent/restore-control-panel" \
            --force-with-lease="refs/heads/agent/restore-control-panel:${EXPECTED_STAGING}"
          echo "BRIDGE_COMMIT=${bridge}"
